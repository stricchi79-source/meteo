<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteo TV</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<!--
  Versione per televisore (browser VIDAA e simili).
  Scritta apposta in JavaScript "vecchio stile" (ES5: niente => , niente `...`, niente fetch)
  e con impaginazione a tabelle, così funziona anche sui browser dei TV più semplici.
  Si aggiorna da sola ogni 15 minuti.
  Località diversa: aggiungi all'indirizzo ?lat=45.07&lon=7.69&nome=Torino
-->
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#0b1622;color:#f2f6fa;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.2;cursor:none;text-shadow:0 .1rem .35rem rgba(0,0,0,.85)}
/* Foto del paese sullo sfondo, scurita perché le scritte restino leggibili */
#bg{position:absolute;top:0;left:0;right:0;bottom:0;background-color:#0b1622;background-position:center center;background-repeat:no-repeat;background-size:cover;-webkit-background-size:cover}
#velo{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;background:rgba(4,10,18,.62)}
#credit{position:absolute;right:2rem;bottom:.35rem;font-size:.9rem;color:#c8d4de;text-shadow:0 0 .3rem #000}
#app{position:absolute;top:0;left:0;right:0;bottom:0;padding:1.2rem 2rem;box-sizing:border-box;-webkit-box-sizing:border-box}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td{padding:0;vertical-align:middle}
.rain{color:#6cc0ff}
.warm{color:#ffb066}

/* Intestazione */
#place{font-size:2.6rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upd{font-size:1.3rem;color:#c6d4e0;margin-top:.2rem}
#clock{font-size:3.4rem;font-weight:bold;text-align:right;line-height:1}
#allerta{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;margin-top:.5rem;font-size:1.5rem;font-weight:bold;padding:.35rem .9rem;border-radius:.6rem;text-shadow:none}
#allerta.a0{background:rgba(10,24,38,.62);color:#9be0b0;font-weight:normal;font-size:1.3rem}
#allerta.a1{background:#ffd84d;color:#231a00}
#allerta.a2{background:#ff9a3c;color:#231a00}
#allerta.a3{background:#d32f2f;color:#ffffff}
#date{font-size:1.4rem;color:#c6d4e0;text-align:right;margin-top:.2rem}

/* Adesso */
.hero{margin-top:.6rem}
.bigico{width:8rem;height:8rem;display:block}
#temp{font-size:8rem;font-weight:bold;line-height:1}
#temp sup{font-size:3rem;color:#c6d4e0;vertical-align:top;position:relative;top:.6rem}
#cond{font-size:2.3rem;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:1.6rem;color:#c6d4e0;margin-top:.3rem;white-space:nowrap}
.cell{background:#16283a;background:rgba(10,24,38,.62);border-radius:.8rem;padding:.6rem 1rem;margin:.3rem}
.k{font-size:1.15rem;color:#c6d4e0;text-transform:uppercase;letter-spacing:.1rem}
.v{font-size:2.5rem;font-weight:bold;margin-top:.15rem;white-space:nowrap;overflow:hidden}
.v small{font-size:1.3rem;font-weight:normal;color:#c6d4e0;margin-left:.3rem}

/* Ore e giorni */
h2{font-size:1.25rem;color:#c6d4e0;text-transform:uppercase;letter-spacing:.15rem;margin:.9rem 0 .4rem;font-weight:bold}
.strip td{text-align:center}
.box{background:#16283a;background:rgba(10,24,38,.62);border-radius:.8rem;padding:.4rem .2rem;margin:0 .25rem}
.box.now{background:#1f4466;background:rgba(31,78,122,.85)}
.t{font-size:1.4rem;color:#c6d4e0}
.box.now .t{color:#ffffff;font-weight:bold}
.ico{width:3.3rem;height:3.3rem;display:block;margin:.15rem auto}
.d{font-size:2.2rem;font-weight:bold}
.d .lo{color:#c6d4e0;font-weight:normal}
.p{font-size:1.3rem;color:#6cc0ff;height:1.6rem;line-height:1.6rem}

#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:3rem;color:#c6d4e0}

/* Vento nelle caselle delle ore */
.w{font-size:1.15rem;color:#c6d4e0}
/* Avviso pioggia in arrivo */
#pioggia{margin-top:.6rem;background:#1f6fb2;color:#ffffff;border-radius:.8rem;padding:.6rem 1.2rem;text-shadow:none;font-size:2.2rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pioggia small{font-size:1.5rem;font-weight:normal;margin-left:1rem}
#pioggia.ora{background:#174a7c}
/* Consiglio per il lavoro */
#consiglio{margin-top:.5rem;font-size:1.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#consiglio b{color:#ffcf6b}
/* Nota allerte ufficiali */
#ufficiali{position:absolute;left:2rem;bottom:.35rem;font-size:.9rem;color:#c8d4de;text-shadow:0 0 .3rem #000}
/* Radar a schermo intero, si alterna con il meteo */
#radar{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#cfd8e0;display:none}
#rtiles{position:absolute;top:0;left:0}
#rtiles img{position:absolute;display:block}
#rpunto{position:absolute;width:1.4rem;height:1.4rem;margin:-.7rem 0 0 -.7rem;border-radius:50%;background:#d0702a;border:.25rem solid #ffffff}
#rtitolo{position:absolute;top:1.2rem;left:2rem;background:rgba(10,24,38,.85);border-radius:.8rem;padding:.6rem 1.2rem;font-size:2.4rem;font-weight:bold}
#rtitolo small{display:block;font-size:1.4rem;font-weight:normal;color:#c6d4e0;margin-top:.2rem}
#rbarra{position:absolute;left:2rem;right:2rem;bottom:2.2rem;height:.6rem;background:rgba(10,24,38,.6);border-radius:.3rem;overflow:hidden}
#rbarra div{height:100%;width:0;background:#1f6fb2}
#rcredit{position:absolute;right:1rem;bottom:.3rem;font-size:.9rem;color:#14202b;text-shadow:none;background:rgba(255,255,255,.7);padding:.1rem .4rem;border-radius:.3rem}
</style>
</head>
<body>
<div id="bg"></div><div id="velo"></div>
<div id="app" style="display:none"><div id="inner">
  <table><tr>
    <td style="width:60%"><div id="place">Meteo</div><div id="upd">&nbsp;</div></td>
    <td><div id="clock">--:--</div><div id="date">&nbsp;</div></td>
  </tr></table>
  <div id="allerta" style="display:none"></div>
  <div id="pioggia" style="display:none"></div>

  <table class="hero"><tr>
    <td style="width:42%">
      <table><tr>
        <td style="width:9rem"><div id="bigico"></div></td>
        <td><div id="temp">--</div></td>
      </tr></table>
      <div id="cond">&nbsp;</div>
      <div id="sub">&nbsp;</div>
    </td>
    <td>
      <div id="cells"></div>
    </td>
  </tr></table>
  <div id="consiglio">&nbsp;</div>

  <h2>Prossime ore</h2>
  <div id="hours"></div>

  <h2>Prossimi giorni</h2>
  <div id="days"></div>
</div></div>
<div id="msg">Caricamento del meteo…</div>
<div id="credit"></div>
<div id="ufficiali">Indicazioni non ufficiali: per le allerte vere segui la Protezione Civile e il tuo Comune</div>
<div id="radar"><div id="rtiles"></div><div id="rpunto"></div>
  <div id="rtitolo">Radar pioggia<small id="rora">&nbsp;</small></div>
  <div id="rbarra"><div id="rbar"></div></div>
  <div id="rcredit">Radar RainViewer · mappa © OpenStreetMap</div>
</div>

<script>
(function(){
  var AGGIORNA_MS = 15 * 60 * 1000;      // ogni 15 minuti
  var RIPROVA_MS  = 2 * 60 * 1000;       // se manca la rete riprova dopo 2 minuti

  /* ---- Località: predefinita oppure dall'indirizzo (?lat=..&lon=..&nome=..) ---- */
  var place = {name:'Castelnuovo Bormida', lat:44.742, lon:8.551};
  function param(k){
    var m = new RegExp('[?&]' + k + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  if(param('lat') && param('lon')){
    place = {name: param('nome') || 'Meteo', lat: parseFloat(param('lat')), lon: parseFloat(param('lon'))};
  }

  function $(id){ return document.getElementById(id); }

  /* ---- Dimensione delle scritte: tutto si adatta allo schermo (pensato per 1280x720) ---- */
  function scala(){
    var w = window.innerWidth || document.documentElement.clientWidth || 1280;
    var h = window.innerHeight || document.documentElement.clientHeight || 720;
    var s = Math.min(w / 1280, h / 720) * 16;
    document.documentElement.style.fontSize = s.toFixed(2) + 'px';
  }
  scala();
  window.onresize = function(){ if(lastData) adatta(); else scala(); };

  /* ---- Icone ---- */
  var SUN = '#ffb347', GREY = '#b9c7d4', RAIN = '#6cc0ff';
  var parts = {
    sun: '<g stroke="'+SUN+'"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>',
    moon: '<path stroke="'+GREY+'" d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>',
    smallSun: '<g stroke="'+SUN+'"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.3M2 8h1.3M3.8 3.8l.9.9M12.2 3.8l-.9.9"/></g>',
    smallMoon: '<path stroke="'+GREY+'" d="M11 9.5A4.5 4.5 0 0 1 5.5 4a4.5 4.5 0 1 0 5.5 5.5z"/>',
    cloud: '<path stroke="'+GREY+'" d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z"/>',
    cloudHi: '<path stroke="'+GREY+'" d="M7 15h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 15z"/>',
    rain: '<path stroke="'+RAIN+'" d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    drizzle: '<path stroke="'+RAIN+'" d="M9 18.5v1.5M13 18.5v1.5M17 18.5v1.5"/>',
    snow: '<path stroke="#ffffff" stroke-width="2.4" d="M8 19v.1M12 20.5v.1M16 19v.1M10 22v.1M14 22v.1"/>',
    bolt: '<path stroke="'+SUN+'" d="M12.5 15l-2 4h3l-2 4"/>',
    fog: '<path stroke="'+GREY+'" d="M4 14h16M6 17.5h12M8 21h8"/>'
  };
  function icon(code, day, cls){
    var g;
    if(code === 0) g = day ? parts.sun : parts.moon;
    else if(code <= 2) g = (day ? parts.smallSun : parts.smallMoon) + parts.cloud;
    else if(code === 3) g = parts.cloud;
    else if(code === 45 || code === 48) g = parts.fog;
    else if(code >= 51 && code <= 57) g = parts.cloudHi + parts.drizzle;
    else if((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) g = parts.cloudHi + parts.rain;
    else if((code >= 71 && code <= 77) || code === 85 || code === 86) g = parts.cloudHi + parts.snow;
    else if(code >= 95) g = parts.cloudHi + parts.bolt;
    else g = parts.cloud;
    return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + g + '</svg>';
  }
  var WMO = {0:'Sereno',1:'Prevalentemente sereno',2:'Parzialmente nuvoloso',3:'Coperto',45:'Nebbia',48:'Nebbia con brina',
    51:'Pioviggine debole',53:'Pioviggine',55:'Pioviggine intensa',56:'Pioviggine gelata',57:'Pioviggine gelata intensa',
    61:'Pioggia debole',63:'Pioggia',65:'Pioggia forte',66:'Pioggia gelata',67:'Pioggia gelata forte',
    71:'Neve debole',73:'Neve',75:'Neve forte',77:'Granelli di neve',80:'Rovesci deboli',81:'Rovesci',82:'Rovesci violenti',
    85:'Rovesci di neve',86:'Rovesci di neve forti',95:'Temporale',96:'Temporale con grandine',99:'Temporale con grandine forte'};
  var DIRS = ['N','NE','E','SE','S','SO','O','NO'];
  var GIORNI = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  var GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  function r(n){ return Math.round(n); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function hhmm(s){ return s.substr(11, 5); }
  /* "2026-11-15" -> giorno della settimana (senza affidarsi al parser di date del browser) */
  function weekday(s){
    var d = new Date(Date.UTC(parseInt(s.substr(0,4),10), parseInt(s.substr(5,2),10)-1, parseInt(s.substr(8,2),10)));
    return d.getUTCDay();
  }
  /* Ora attuale nel fuso della località, nel formato "YYYY-MM-DDTHH:MM" come i dati */
  function localNow(off){
    var d = new Date(new Date().getTime() + (off || 0) * 1000);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }

  /* ---- Orologio (ora del televisore) ---- */
  function orologio(){
    var d = new Date();
    $('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').innerHTML = GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()];
  }
  orologio();
  setInterval(orologio, 10000);

  /* ---- Scarica i dati ---- */
  var lastData = null, lastOk = 0, timer = null;

  /* ---- Foto di sfondo: cambiano a turno ogni 15 minuti (foto libere da Wikimedia Commons) ---- */
  var FOTO = [
    {f:'foto/1.jpg', c:'Panorama · foto F Ceragioli, CC BY-SA 3.0'},
    {f:'foto/2.jpg', c:'Castello · foto Davide Papalini, CC BY-SA 3.0'},
    {f:'foto/3.jpg', c:'Torre del castello · foto Davide Papalini, CC BY-SA 3.0'},
    {f:'foto/4.jpg', c:'Chiesa dei Santi Quirico e Giulitta · foto Terensky, CC BY 3.0'},
    {f:'foto/5.jpg', c:'Chiesa dei Santi Quirico e Giulitta · foto Davide Papalini, CC BY-SA 3.0'},
    {f:'foto/6.jpg', c:'Municipio · foto F Ceragioli, CC BY-SA 3.0'}
  ];
  var fotoOra = -1;
  function sfondo(){
    if(place.name !== 'Castelnuovo Bormida' && param('lat')) return;   // le foto sono solo del paese
    var i = Math.floor(new Date().getTime() / AGGIORNA_MS) % FOTO.length;
    if(i === fotoOra) return;
    fotoOra = i;
    $('bg').style.backgroundImage = 'url(' + FOTO[i].f + ')';
    $('credit').innerHTML = FOTO[i].c + ' · Wikimedia Commons';
    var pre = new Image(); pre.src = FOTO[(i + 1) % FOTO.length].f;      // prepara già la prossima
  }
  sfondo();
  setInterval(sfondo, 30000);
  function memo(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

  function carica(){
    clearTimeout(timer);
    caricaAllerte();
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
      '&hourly=temperature_2m,precipitation_probability,weather_code,is_day,precipitation,apparent_temperature,wind_speed_10m,wind_gusts_10m' +
      '&minutely_15=precipitation&forecast_minutely_15=12' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max' +
      '&timezone=auto&forecast_days=7';
    var x = new XMLHttpRequest();
    x.open('GET', url + '&_=' + new Date().getTime(), true);
    try{ x.timeout = 30000; }catch(e){}
    x.onreadystatechange = function(){
      if(x.readyState !== 4) return;
      var data = null;
      if(x.status === 200){ try{ data = JSON.parse(x.responseText); }catch(e){ data = null; } }
      if(data && data.current){
        lastData = data; lastOk = new Date().getTime();
        memo('meteo.tv', {d: data, t: lastOk});
        try{ disegna(); }catch(e){ mostraErrore('Errore nel mostrare i dati'); }
        timer = setTimeout(carica, AGGIORNA_MS);
      }else{
        if(lastData){ try{ disegna(); }catch(e){} }
        else mostraErrore('Non riesco a scaricare il meteo. Riprovo tra 2 minuti…');
        timer = setTimeout(carica, RIPROVA_MS);
      }
    };
    x.ontimeout = function(){};   // gestito da onreadystatechange (status 0)
    x.send();
  }
  /* ---- Allerte: Protezione Civile (zona Belbo e Bormida) e MeteoAlarm (Piemonte) ----
     Il file allerte.json viene aggiornato ogni 30 minuti da GitHub Actions. */
  var allerte = memo('meteo.tv.allerte');
  var COLORE = ['', 'GIALLA', 'ARANCIONE', 'ROSSA'];
  var TIPI = {'Wind':'vento','Snow/Ice':'neve e ghiaccio','snow-ice':'neve e ghiaccio','Thunderstorm':'temporali','Fog':'nebbia',
    'High temperature':'caldo','high-temperature':'caldo','Low temperature':'freddo','low-temperature':'freddo',
    'Forest fire':'incendi boschivi','forest-fire':'incendi boschivi','Rain':'pioggia','Flooding':'piene dei fiumi','Rain/Flood':'pioggia e piene'};
  function caricaAllerte(){
    if(param('lat')) return;            // le allerte sono solo per Castelnuovo Bormida
    var x = new XMLHttpRequest();
    x.open('GET', '../allerte.json?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if(x.readyState !== 4 || x.status !== 200) return;
      try{ allerte = JSON.parse(x.responseText); memo('meteo.tv.allerte', allerte); }catch(e){}
      if(lastData){ try{ disegna(); }catch(e){} }
    };
    x.send();
  }
  /* ISO "2026-11-15T14:00:00+01:00" -> millisecondi, senza affidarsi al parser del browser */
  function isoMs(s){
    var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?(?:\.\d+)?(Z|([+-])(\d\d):?(\d\d))?/.exec(s || '');
    if(!m) return 0;
    var t = Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
    if(m[8]) t -= (m[8] === '+' ? 1 : -1) * ((+m[9])*60 + (+m[10])) * 60000;
    return t;
  }
  function mostraAllerte(oggi){
    var el = $('allerta');
    if(!allerte || param('lat')){ el.style.display = 'none'; return; }
    var voci = [], i, k, lv, pc = allerte.protezione_civile, valido = false;
    var RISCHI = ['idrogeologico', 'idraulico', 'temporali'];
    if(pc && pc.giorni){
      for(i = 0; i < pc.giorni.length; i++){
        var g = pc.giorni[i];
        if(g.data < oggi) continue;
        valido = true;
        for(lv = 3; lv >= 1; lv--){
          var r = [];
          for(k = 0; k < RISCHI.length; k++){ if(g[RISCHI[k]] === lv) r.push(RISCHI[k]); }
          if(r.length) voci.push({lv: lv, t: 'ALLERTA ' + COLORE[lv] + (g.data === oggi ? ' OGGI' : ' DOMANI') + ' · rischio ' + r.join(', ')});
        }
      }
    }
    var ma = allerte.meteoalarm || [], ora = new Date().getTime();
    for(i = 0; i < ma.length; i++){
      if(ma[i].fine && isoMs(ma[i].fine) < ora) continue;
      voci.push({lv: ma[i].livello, t: 'AVVISO ' + COLORE[ma[i].livello] + ' · ' + (TIPI[ma[i].tipo] || ma[i].tipo) + ' (Piemonte)'});
    }
    if(voci.length){
      voci.sort(function(a, b){ return b.lv - a.lv; });
      el.className = 'a' + voci[0].lv;
      el.innerHTML = '⚠ ' + voci[0].t + (voci.length > 1 ? ' &nbsp;+' + (voci.length - 1) + ' altre' : '');
      el.style.display = 'inline-block';
    }else if(valido){
      el.className = 'a0';
      el.innerHTML = '✓ Nessuna allerta oggi e domani · Protezione Civile';
      el.style.display = 'inline-block';
    }else{
      el.style.display = 'none';
    }
  }

  function mostraErrore(t){ $('msg').innerHTML = t; $('msg').style.display = 'block'; }

  /* ---- Disegna la pagina ---- */
  function disegna(){
    var d = lastData, c = d.current, h = d.hourly, dl = d.daily, i;
    var nowL = localNow(d.utc_offset_seconds);

    var di = 0;
    for(i = 0; i < dl.time.length; i++){ if(dl.time[i] === nowL.substr(0,10)){ di = i; break; } }
    var giorno = dl.sunrise && dl.sunrise[di] ? (nowL >= dl.sunrise[di] && nowL < dl.sunset[di]) : c.is_day === 1;
    document.body.className = giorno ? 'giorno' : '';

    $('place').innerHTML = place.name;
    var min = r((new Date().getTime() - lastOk) / 60000);
    var agg = 'Aggiornato alle ' + pad(new Date(lastOk).getHours()) + ':' + pad(new Date(lastOk).getMinutes()) + ' · si aggiorna da solo ogni 15 minuti · dati Open-Meteo';
    if(min > 20) agg = 'Senza rete · dati delle ' + pad(new Date(lastOk).getHours()) + ':' + pad(new Date(lastOk).getMinutes());
    $('upd').innerHTML = agg;
    mostraAllerte(nowL.substr(0, 10));

    $('bigico').innerHTML = icon(c.weather_code, giorno, 'bigico');
    $('temp').innerHTML = r(c.temperature_2m) + '<sup>°C</sup>';
    $('cond').innerHTML = WMO[c.weather_code] || '&nbsp;';
    $('sub').innerHTML = 'Percepita ' + r(c.apparent_temperature) + '° &nbsp;·&nbsp; <span class="warm">Max ' + r(dl.temperature_2m_max[di]) + '°</span> &nbsp; <span class="rain">Min ' + r(dl.temperature_2m_min[di]) + '°</span>';

    function cell(k, v, u){ return '<td><div class="cell"><div class="k">' + k + '</div><div class="v">' + v + '<small>' + u + '</small></div></div></td>'; }
    var pr = dl.precipitation_probability_max[di];
    $('cells').innerHTML = '<table><tr>' +
        cell('Vento · raffiche', r(c.wind_speed_10m) + ' / ' + r(c.wind_gusts_10m), 'km/h ' + DIRS[Math.round(c.wind_direction_10m / 45) % 8]) +
        cell('Umidità', r(c.relative_humidity_2m), '%') +
        cell('Pressione', r(c.pressure_msl), 'hPa') +
      '</tr><tr>' +
        cell('Pioggia oggi', pr == null ? '–' : pr, '% · ' + (dl.precipitation_sum[di] || 0).toFixed(1) + ' mm') +
        cell('Alba', hhmm(dl.sunrise[di]), '') +
        cell('Tramonto', hhmm(dl.sunset[di]), '') +
      '</tr></table>';

    /* Prossime ore: adesso e poi ogni 3 ore (8 caselle = 24 ore) */
    var hourKey = nowL.substr(0,13) + ':00', start = -1;
    for(i = 0; i < h.time.length; i++){ if(h.time[i] >= hourKey){ start = i; break; } }
    if(start < 0) start = 0;
    var row = '';
    for(var n = 0; n < 8; n++){
      i = start + n * 3;
      if(i >= h.time.length) break;
      var p = h.precipitation_probability[i];
      row += '<td><div class="box' + (n === 0 ? ' now' : '') + '"><div class="t">' + (n === 0 ? 'Adesso' : hhmm(h.time[i])) + '</div>' +
        icon(h.weather_code[i], h.is_day[i] === 1, 'ico') + '<div class="d">' + r(h.temperature_2m[i]) + '°</div>' +
        '<div class="p">' + (p >= 10 ? '☂ ' + p + '%' : '') + '</div>' +
        (h.wind_speed_10m ? '<div class="w">vento ' + r(h.wind_speed_10m[i]) + ' km/h</div>' : '') + '</div></td>';
    }
    $('hours').innerHTML = '<table class="strip"><tr>' + row + '</tr></table>';

    /* Avviso pioggia in arrivo e consiglio per il lavoro */
    var av = avvisoPioggia(d, start, nowL), elP = $('pioggia');
    if(av){ elP.className = av.ora ? 'ora' : ''; elP.innerHTML = av.t + '<small>' + av.s + '</small>'; elP.style.display = 'block'; }
    else elP.style.display = 'none';
    var co = consiglio(d, start, di, nowL);
    $('consiglio').innerHTML = co || '&nbsp;';

    /* Prossimi giorni */
    row = '';
    for(i = di; i < dl.time.length && i < di + 7; i++){
      var nome = i === di ? 'Oggi' : i === di + 1 ? 'Domani' : GG[weekday(dl.time[i])] + ' ' + parseInt(dl.time[i].substr(8,2), 10);
      var pp = dl.precipitation_probability_max[i];
      row += '<td><div class="box"><div class="t">' + nome + '</div>' + icon(dl.weather_code[i], true, 'ico') +
        '<div class="d">' + r(dl.temperature_2m_max[i]) + '° <span class="lo">' + r(dl.temperature_2m_min[i]) + '°</span></div>' +
        '<div class="p">' + (pp >= 10 ? '☂ ' + pp + '%' : '') + '</div></div></td>';
    }
    $('days').innerHTML = '<table class="strip"><tr>' + row + '</tr></table>';

    $('msg').style.display = 'none';
    $('app').style.display = 'block';
    adatta();
  }

  /* ---- Pioggia in arrivo (prossime 6 ore; i quarti d'ora di Open-Meteo per l'orario preciso) ---- */
  function isNeve(c){ return (c >= 71 && c <= 77) || c === 85 || c === 86; }
  function isPioggia(c){ return (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95; }
  function mm(v){ return v.toFixed(1).replace('.', ','); }
  function minutiTra(a, b){ return Math.round((isoMs(b) - isoMs(a)) / 60000); }
  function avvisoPioggia(d, start, nowL){
    var h = d.hourly, c = d.current, m = d.minutely_15, prec = h.precipitation || [], i, j, m0 = -1;
    if(m && m.time){ for(i = 0; i < m.time.length; i++){ if(m.time[i] > nowL){ m0 = Math.max(0, i - 1); break; } } }
    var piove = (c.precipitation || 0) >= 0.1 || (m0 >= 0 && (m.precipitation[m0] || 0) >= 0.1) ||
                (isPioggia(c.weather_code) && h.precipitation_probability[start] >= 50);
    if(piove){
      var fine = null;
      for(i = start + 1; i < Math.min(start + 12, h.time.length); i++){ if((prec[i] || 0) < 0.1 && h.precipitation_probability[i] < 40){ fine = hhmm(h.time[i]); break; } }
      return {ora: true, t: isNeve(c.weather_code) ? 'Sta nevicando' : 'Sta piovendo', s: fine ? 'dovrebbe smettere verso le ' + fine : 'anche nelle prossime ore'};
    }
    var quando = null;
    if(m0 >= 0){ for(i = m0 + 1; i < m.time.length; i++){ if((m.precipitation[i] || 0) >= 0.1){ quando = m.time[i]; break; } } }
    for(i = start; i < Math.min(start + 6, h.time.length); i++){
      var p = h.precipitation_probability[i], q = prec[i] || 0, code = h.weather_code[i];
      if((q >= 0.2 && p >= 30) || (p >= 60 && (isPioggia(code) || isNeve(code)))){
        var t = quando && quando < h.time[i] ? quando : h.time[i], tot = 0, pmax = 0;
        for(j = i; j < Math.min(i + 3, h.time.length); j++){ tot += prec[j] || 0; pmax = Math.max(pmax, h.precipitation_probability[j]); }
        var nome = code >= 95 ? 'Temporale in arrivo' : isNeve(code) ? 'Neve in arrivo' : 'Pioggia in arrivo';
        var min = minutiTra(nowL + ':00', t + ':00');
        var tra = min <= 60 ? 'tra circa ' + Math.max(15, Math.round(min / 15) * 15) + ' minuti' : 'verso le ' + hhmm(t);
        return {ora: false, t: '☂ ' + nome + ' ' + tra, s: 'probabilità ' + pmax + '%' + (tot >= 0.1 ? ' · circa ' + mm(tot) + ' mm' : '')};
      }
    }
    return null;
  }

  /* ---- Consiglio per il lavoro (fuori, a piedi): dalle 6 alle 20, la sera guarda a domani ---- */
  function consiglio(d, start, di, nowL){
    var h = d.hourly, dl = d.daily, i, oraN = parseInt(nowL.substr(11, 2), 10), domani = oraN >= 19;
    var giorno = domani ? dl.time[Math.min(di + 1, dl.time.length - 1)] : nowL.substr(0, 10);
    var app = h.apparent_temperature || h.temperature_2m, raff = h.wind_gusts_10m || [], prec = h.precipitation || [];
    var pMax = 0, pOra = '', tot = 0, aMin = 99, aMax = -99, tMin = 99, gMax = 0, neve = false, nebbia = false, temp = false, n = 0;
    for(i = 0; i < h.time.length; i++){
      var hh = parseInt(h.time[i].substr(11, 2), 10);
      if(h.time[i].substr(0, 10) !== giorno || hh < 6 || hh > 20 || (!domani && i < start)) continue;
      n++;
      var p = h.precipitation_probability[i], code = h.weather_code[i];
      if(p > pMax){ pMax = p; pOra = hhmm(h.time[i]); }
      tot += prec[i] || 0;
      aMin = Math.min(aMin, app[i]); aMax = Math.max(aMax, app[i]); tMin = Math.min(tMin, h.temperature_2m[i]);
      gMax = Math.max(gMax, raff[i] || 0);
      if(isNeve(code) && p >= 40) neve = true;
      if(code === 45 || code === 48) nebbia = true;
      if(code >= 95 && p >= 40) temp = true;
    }
    if(!n) return '';
    var uv = (dl.uv_index_max || [])[domani ? Math.min(di + 1, dl.time.length - 1) : di] || 0, L = [];
    if(pMax >= 50 || tot >= 1) L.push('porta l\'ombrello' + (pOra ? ' (pioggia verso le ' + pOra + ')' : ''));
    else if(pMax >= 30) L.push('ombrello pieghevole nello zaino (' + pMax + '%)');
    if(temp) L.push('possibili temporali');
    if(aMin <= 0) L.push('copriti molto bene: guanti e berretto (percepita ' + r(aMin) + '°)');
    else if(aMin <= 7) L.push('copriti bene (percepita fino a ' + r(aMin) + '°)');
    else if(aMin <= 14) L.push('porta una giacca o una felpa');
    if(aMax >= 30) L.push('fa caldo: porta acqua');
    if(uv >= 6) L.push('crema solare e cappello');
    if(gMax >= 50) L.push('vento forte, raffiche fino a ' + r(gMax) + ' km/h');
    if(neve) L.push('neve: scarpe con buona suola');
    else if(tMin <= 1 && (tot > 0 || pMax >= 40)) L.push('attenzione al ghiaccio');
    if(nebbia) L.push('nebbia: vestiti chiari per farti vedere');
    if(!L.length) L.push('giornata tranquilla, niente ombrello');
    var testo = L.join(' · ');
    return '<b>Per il lavoro ' + (domani ? 'domani' : 'oggi') + ':</b> ' + testo.charAt(0).toUpperCase() + testo.substr(1);
  }

  /* ---- Radar pioggia a schermo intero: si alterna con il meteo (1 minuto meteo, 20 secondi radar) ---- */
  var RZ = 7, radarF = [], radarHost = '', radarI = 0, radarOn = false, radarAnim = null, radarImgs = [], radarT = 0;
  function caricaRadar(){
    var x = new XMLHttpRequest();
    x.open('GET', 'https://api.rainviewer.com/public/weather-maps.json?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if(x.readyState !== 4 || x.status !== 200) return;
      try{ var j = JSON.parse(x.responseText); radarHost = j.host; radarF = (j.radar.past || []).concat(j.radar.nowcast || []); }catch(e){ radarF = []; }
    };
    x.send();
  }
  function costruisciRadar(){
    var W = window.innerWidth || 1280, H = window.innerHeight || 720;
    var T = Math.round(Math.max(W / 1280, H / 720) * 384);      // piastrelle ingrandite 1,5x
    var n = Math.pow(2, RZ), lat = place.lat * Math.PI / 180;
    var px = (place.lon + 180) / 360 * n * T;
    var py = (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * n * T;
    var ox = Math.round(W / 2 - px), oy = Math.round(H / 2 - py);
    var x0 = Math.floor(-ox / T), x1 = Math.floor((W - ox) / T), y0 = Math.floor(-oy / T), y1 = Math.floor((H - oy) / T);
    var html = '', tx, ty;
    radarImgs = [];
    for(ty = y0; ty <= y1; ty++){
      for(tx = x0; tx <= x1; tx++){
        if(ty < 0 || ty >= n) continue;
        var wx = ((tx % n) + n) % n, st = 'left:' + (ox + tx * T) + 'px;top:' + (oy + ty * T) + 'px;width:' + T + 'px;height:' + T + 'px';
        html += '<img src="https://tile.openstreetmap.org/' + RZ + '/' + wx + '/' + ty + '.png" style="' + st + '" alt="">';
        html += '<img class="rv" data-x="' + wx + '" data-y="' + ty + '" style="' + st + ';opacity:.75" alt="">';
      }
    }
    $('rtiles').innerHTML = html;
    var all = $('rtiles').getElementsByTagName('img');
    for(var k = 0; k < all.length; k++){ if(all[k].className === 'rv') radarImgs.push(all[k]); }
    $('rpunto').style.left = Math.round(W / 2) + 'px'; $('rpunto').style.top = Math.round(H / 2) + 'px';
  }
  function frameRadar(){
    var f = radarF[radarI]; if(!f) return;
    for(var k = 0; k < radarImgs.length; k++){
      var im = radarImgs[k];
      im.src = radarHost + f.path + '/256/' + RZ + '/' + im.getAttribute('data-x') + '/' + im.getAttribute('data-y') + '/2/1_1.png';
    }
    var t = new Date(f.time * 1000), min = Math.round((f.time * 1000 - new Date().getTime()) / 60000);
    $('rora').innerHTML = 'ore ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + (min > 5 ? ' · previsione' : min < -12 ? ' · ' + (-min) + ' minuti fa' : ' · adesso') + ' &nbsp;·&nbsp; ultime 2 ore';
    $('rbar').style.width = ((radarI + 1) / radarF.length * 100) + '%';
  }
  function mostraRadar(si){
    radarOn = si; clearTimeout(radarAnim);
    $('radar').style.display = si ? 'block' : 'none';
    if(!si) return;
    costruisciRadar(); radarI = 0;
    (function passo(){
      frameRadar();
      var ultimo = radarI === radarF.length - 1;
      radarAnim = setTimeout(function(){ radarI = (radarI + 1) % radarF.length; passo(); }, ultimo ? 2500 : 700);
    })();
  }
  setInterval(function(){
    radarT++;
    if(!radarOn && radarT >= 60 && radarF.length && lastData){ radarT = 0; mostraRadar(true); }
    else if(radarOn && radarT >= 20){ radarT = 0; mostraRadar(false); }
  }, 1000);
  caricaRadar();
  setInterval(caricaRadar, 10 * 60 * 1000);

  /* Se qualcosa non ci sta in altezza, rimpicciolisco tutto quanto basta */
  function adatta(){
    scala();
    var h = window.innerHeight || document.documentElement.clientHeight || 720;
    var fs = parseFloat(document.documentElement.style.fontSize);
    var alto = $('inner').offsetHeight + 3.4 * fs;
    if(alto > h){ document.documentElement.style.fontSize = (fs * h / alto * 0.98).toFixed(2) + 'px'; }
  }

  /* Mentre è acceso, ogni minuto ridisegna (cambio d'ora, "senza rete"); il download resta ogni 15 minuti */
  setInterval(function(){ if(lastData){ try{ disegna(); }catch(e){} } }, 60000);

  /* Una volta al giorno ricarica la pagina intera (prende anche eventuali nuove versioni) */
  setTimeout(function(){ location.reload(); }, 24 * 60 * 60 * 1000);

  /* Tasto OK / Invio del telecomando: prova a mettere a schermo intero */
  document.onkeydown = function(e){
    e = e || window.event;
    var k = e.keyCode;
    if(k === 13){
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if(f){ try{ f.call(el); }catch(err){} }
    }else if(k === 82 || k === 403){ // R oppure tasto rosso: aggiorna subito
      carica();
    }else if(k === 77 || k === 404){ // M oppure tasto verde: mostra o nascondi il radar
      if(radarF.length){ radarT = 0; mostraRadar(!radarOn); }
    }
  };

  /* Avvio: mostro subito gli ultimi dati salvati (se ci sono), poi scarico quelli nuovi */
  var saved = memo('meteo.tv');
  if(saved && saved.d && saved.d.current && new Date().getTime() - saved.t < 6 * 3600000){
    lastData = saved.d; lastOk = saved.t;
    try{ disegna(); }catch(e){}
  }
  carica();
})();
</script>
